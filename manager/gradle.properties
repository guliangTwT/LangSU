android.experimental.enableNewResourceShrinker.preciseShrinking=true
android.enableAppCompileTimeRClass=true
android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
org.gradle.tooling.parallel=true
org.gradle.vfs.watch=true
android.r8.maxWorkers=4
android.native.buildOutput=verbose

# Note: the project path must be ASCII-only. AGP's AIDL compiler reads and writes
# generated files using the platform default charset, so a path containing CJK
# characters fails with MalformedInputException. Setting android.overridePathCheck=true
# only silences the up-front warning - it does not make such a path build, so it is
# deliberately not set here.
