name: Build langsud with cross
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      os:
        required: false
        type: string
        default: ubuntu-latest
      pack_lkm:
        required: false
        type: boolean
        default: false
      pack_langsuinit:
        required: false
        type: boolean
        default: false
jobs:
  build:
    runs-on: ${{ inputs.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Download artifacts
      uses: actions/download-artifact@v8
    
    - name: Prepare LKM files
      if: ${{ inputs.pack_lkm }}
      run: |
        cp aarch64-android*-lkm/*_langsu.ko ./userspace/langsud/bin/aarch64/
        cp x86_64-android*-lkm/*_langsu.ko ./userspace/langsud/bin/x86_64/
    
    - name: Prepare langsuinit
      if: ${{ inputs.pack_langsuinit }}
      run: |
        mv langsuinit-aarch64/langsuinit ./userspace/langsud/bin/aarch64/
        mv langsuinit-x86_64/langsuinit ./userspace/langsud/bin/x86_64/
        mv langsuinit-riscv64/langsuinit ./userspace/langsud/bin/riscv64/
        
    - name: Setup rustup
      run: |
        rustup update stable
        if [[ ${{ inputs.target }} == *"-apple-darwin" ]]; then
          rustup target add ${{ inputs.target }}
        fi
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: userspace/langsud
        cache-targets: false
        cache-bin: false

    - name: Install cross
      run: |
        RUSTFLAGS="" cargo install cross --git https://github.com/cross-rs/cross --rev 66845c1

    - name: Assemble LKM bootstrap
      run: |
        clang --target=aarch64-linux-gnu -c -nostdlib \
          -o userspace/langsud/.lkm_image_bootstrap.o \
          userspace/langsud/src/lkm_image_bootstrap.S

    - name: Build langsud
      run: CROSS_NO_WARNINGS=0 cross build --target ${{ inputs.target }} --release --manifest-path ./userspace/langsud/Cargo.toml

    - name: Upload langsud artifact
      uses: actions/upload-artifact@v7
      with:
        name: langsud-${{ inputs.target }}
        path: target/${{ inputs.target }}/release/langsud*
