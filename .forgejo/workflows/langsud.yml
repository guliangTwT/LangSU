name: Build langsud
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      pack_lkm:
        required: false
        type: boolean
        default: false
      pack_langsuinit:
        required: false
        type: boolean
        default: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Download artifacts
      uses: actions/download-artifact@v8
    
    - name: Prepare LKM files
      if: ${{ inputs.pack_lkm }}
      run: |
        cp aarch64-android*-lkm/*_langsu.ko ./userspace/langsud/bin/aarch64/
        cp x86_64-android*-lkm/*_langsu.ko ./userspace/langsud/bin/x86_64/
    
    - name: Prepare langsuinit
      if: ${{ inputs.pack_langsuinit }}
      run: |
        mv langsuinit-aarch64/langsuinit ./userspace/langsud/bin/aarch64/
        mv langsuinit-x86_64/langsuinit ./userspace/langsud/bin/x86_64/
        mv langsuinit-riscv64/langsuinit ./userspace/langsud/bin/riscv64/
        
    - name: Setup rustup
      run: |
        if [ "${{ inputs.target }}" = riscv64-linux-android ]; then
          rustup toolchain install nightly-2026-09-23 --profile minimal --component rust-src
        else
          rustup update stable
          rustup target add ${{ inputs.target }}
        fi

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: userspace/langsud
        cache-targets: false

    - uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r29

    - name: Build langsud
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          export LANGSU_PACKAGE_NAME="com.langsu.manager.pr"
        fi
        if [ "${{ inputs.target }}" = riscv64-linux-android ]; then
          source .forgejo/scripts/setup-rust-build.sh riscv64-linux-android 35
          cargo +nightly-2026-09-23 build --config .forgejo/riscv64-cargo.toml -Z build-std=std,panic_abort --target "$TRIPLE" --release --manifest-path ./userspace/langsud/Cargo.toml
        else
          source .forgejo/scripts/setup-rust-build.sh ${{ inputs.target }} 26
          cargo build --target "$TRIPLE" --release --manifest-path ./userspace/langsud/Cargo.toml
        fi

    - name: Upload langsud artifact
      uses: actions/upload-artifact@v7
      with:
        name: langsud-${{ inputs.target }}
        path: target/${{ inputs.target }}/release/langsud
