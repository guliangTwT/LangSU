name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-manager:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit

  release:
    needs:
      - build-manager
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Rename langsud
        run: |
          mkdir -p langsud
          for dir in ./langsud-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                langsud_platform_name=$(basename "$dir")
                if [ -f "$dir/langsud" ]; then
                  mv "$dir/langsud" "langsud/$langsud_platform_name"
                elif [ -f "$dir/langsud.exe" ]; then
                  mv "$dir/langsud.exe" "langsud/$langsud_platform_name.exe"
                fi
            fi
          done

      - name: Rename langsuinit
        run: |
          mkdir -p langsuinit
          for dir in ./langsuinit-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                langsuinit_platform_name=$(basename "$dir")
                if [ -f "$dir/langsuinit" ]; then
                  mv "$dir/langsuinit" "langsuinit/$langsuinit_platform_name"
                fi
            fi
          done

      - name: Rename lkm
        run: |
          mkdir -p lkm
          for dir in ./*-android*-lkm; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                lkm_platform_name=$(basename "$dir")
                lkm_platform_name="lkm-${lkm_platform_name%-lkm}_langsu.ko"
                KO="$(ls $dir/*_langsu.ko)"
                mv "$KO" "lkm/$lkm_platform_name"
            fi
          done

      - name: Display structure of downloaded files
        run: ls -R

      # GitHub is the primary channel.
      - name: Publish release to GitHub
        uses: softprops/action-gh-release@v3
        with:
          files: |
            manager/*.apk
            lkm/lkm-*_langsu.ko
            langsud/langsud-*
            langsuinit/*
          body: |
            LangSU ${{ github.ref_name }} 的构建产物：管理器 APK、8 个 KMI 的内核模块、langsud 与 langsuinit。

      # Codeberg mirrors the same release; the manager falls back to it when GitHub is
      # unreachable. Skipped silently when CODEBERG_TOKEN is not configured.
      - name: Mirror release to Codeberg
        env:
          TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "CODEBERG_TOKEN is not configured; Codeberg mirror skipped."
            exit 0
          fi
          API="https://codeberg.org/api/v1/repos/GuLiang/LangSU"
          NOTES="LangSU $TAG 的构建产物：管理器 APK、8 个 KMI 的内核模块、langsud 与 langsuinit。"
          PAYLOAD=$(jq -n --arg tag "$TAG" --arg name "LangSU $TAG" --arg body "$NOTES" \
            '{tag_name:$tag, name:$name, body:$body, draft:false, prerelease:false}')
          RELEASE_ID=$(curl -sS -X POST \
            -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" "$API/releases" | jq -r '.id')
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "Codeberg mirror failed; the GitHub release is unaffected."
            exit 0
          fi
          for FILE in manager/*.apk lkm/lkm-*_langsu.ko langsud/langsud-* langsuinit/*; do
            [ -f "$FILE" ] || continue
            curl -sS -f -X POST \
              -H "Authorization: token $TOKEN" \
              -F "attachment=@$FILE" \
              "$API/releases/$RELEASE_ID/assets?name=$(basename "$FILE")"
            echo "mirrored $(basename "$FILE")"
          done